server:
  host: 0.0.0.0
  web_port: 8000
  syslog_bind_ip: 10.20.30.40
  syslog_udp_port: 1514
  syslog_tcp_port: 1514
  enable_tcp: true
  enable_udp: true
security:
  enable_ip_whitelist: false
  allowed_device_ips: []
database:
  path: data/syslog_analyzer.db
  retention_days: 30
alerts:
  cooldown_seconds: 60
  auto_acknowledge_minutes: 0
  sound_alert_enabled: true
notifications:
  telegram:
    enabled: false
    bot_token: ''
    chat_id: ''
  slack:
    enabled: false
    webhook_url: ''
    channel: '#network-alerts'
  discord:
    enabled: false
    webhook_url: ''
  ms_teams:
    enabled: false
    webhook_url: ''
  generic_webhook:
    enabled: false
    webhook_url: ''
    headers: {}
  email:
    enabled: false
    smtp_server: smtp.gmail.com
    smtp_port: 587
    use_tls: true
    username: ''
    password: ''
    from_email: netlog-alerts@company.com
    to_emails: []
rules:
  high_cpu_threshold: 85
  high_mem_threshold: 85
