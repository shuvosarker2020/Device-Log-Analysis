services:
  netlogiq:
    build: .
    container_name: netlogiq
    restart: unless-stopped
    ports:
      - "8000:8000"        # Web Dashboard (Change to 80:8000 if no reverse proxy)
      - "514:514/udp"      # Syslog UDP (Standard network syslog port)
      - "514:514/tcp"      # Syslog TCP
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats/summary"]
      interval: 30s
      timeout: 5s
      retries: 3
